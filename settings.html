<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
  <title>Настройки</title>
</head>
<body>

<div class="container-fluid">
  <div class="row">

    <!-- Боковая панель (на телефоне скрыта, вместо неё нижнее меню) -->
    <aside class="col-md-3 col-xl-2 d-none d-md-block border-right min-vh-100 pt-3">
      <nav>
        <ul class="nav nav-pills flex-column">
          <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="feed.html">Сиянье</a></li>
          <li class="nav-item"><a class="nav-link" href="friends.html">Друзья</a></li>
          <li class="nav-item"><a class="nav-link active" href="settings.html">Настройки</a></li>
        </ul>
      </nav>

    </aside>

    <!-- Основное содержимое -->
    <main class="col-12 col-md-9 col-xl-10 pt-3 pb-5">
      <h1 class="h4 mb-3 text-center">Настройки</h1>
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 col-xl-4">
        <div class="card text-center mb-3">
          <div class="card-body">
            <div class="d-flex justify-content-center align-items-end mb-3">
              <img src="https://randomuser.me/api/portraits/men/65.jpg" class="rounded-circle profile-avatar" width="120" height="120" alt="Аватар">
              <button type="button" class="btn btn-sm btn-link" aria-label="Изменить аватар">
                <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                  <path d="M13.3601 3.07866L14.2869 2.15178C15.8226 0.616074 18.3125 0.616074 19.8482 2.15178C21.3839 3.68748 21.3839 6.17735 19.8482 7.71306L18.9213 8.63993M13.3601 3.07866C13.3601 3.07866 13.4759 5.04828 15.2138 6.78618C16.9517 8.52407 18.9213 8.63993 18.9213 8.63993M13.3601 3.07866L11 5.43872M7.5 8.93872L4.83882 11.5999L4.83881 11.5999C4.26166 12.1771 3.97308 12.4656 3.7249 12.7838C3.43213 13.1592 3.18114 13.5653 2.97634 13.995C2.80273 14.3593 2.67368 14.7465 2.41556 15.5208L1.32181 18.8021L1.05445 19.6042C0.927428 19.9852 1.0266 20.4053 1.31063 20.6894C1.59466 20.9734 2.01478 21.0726 2.39584 20.9456L3.19792 20.6782L6.47918 19.5844L6.47919 19.5844C7.25353 19.3263 7.6407 19.1973 8.00498 19.0237C8.43469 18.8189 8.84082 18.5679 9.21616 18.2751C9.53435 18.0269 9.82293 17.7383 10.4001 17.1612L10.4001 17.1612L10.5613 17L13.6607 13.9006L18.9213 8.63993M3.19792 20.6782L1.32181 18.8021" stroke-width="2" stroke-linecap="round" stroke="currentColor"/>
                </svg>
              </button>
            </div>
            <div class="d-flex justify-content-center align-items-center mb-3">
              <h4 class="mb-0">Алексей Смирнов</h4>
              <button type="button" class="btn btn-sm btn-link" aria-label="Изменить никнейм">
                <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                  <path d="M13.3601 3.07866L14.2869 2.15178C15.8226 0.616074 18.3125 0.616074 19.8482 2.15178C21.3839 3.68748 21.3839 6.17735 19.8482 7.71306L18.9213 8.63993M13.3601 3.07866C13.3601 3.07866 13.4759 5.04828 15.2138 6.78618C16.9517 8.52407 18.9213 8.63993 18.9213 8.63993M13.3601 3.07866L11 5.43872M7.5 8.93872L4.83882 11.5999L4.83881 11.5999C4.26166 12.1771 3.97308 12.4656 3.7249 12.7838C3.43213 13.1592 3.18114 13.5653 2.97634 13.995C2.80273 14.3593 2.67368 14.7465 2.41556 15.5208L1.32181 18.8021L1.05445 19.6042C0.927428 19.9852 1.0266 20.4053 1.31063 20.6894C1.59466 20.9734 2.01478 21.0726 2.39584 20.9456L3.19792 20.6782L6.47918 19.5844L6.47919 19.5844C7.25353 19.3263 7.6407 19.1973 8.00498 19.0237C8.43469 18.8189 8.84082 18.5679 9.21616 18.2751C9.53435 18.0269 9.82293 17.7383 10.4001 17.1612L10.4001 17.1612L10.5613 17L13.6607 13.9006L18.9213 8.63993M3.19792 20.6782L1.32181 18.8021" stroke-width="2" stroke-linecap="round" stroke="currentColor"/>
                </svg>
              </button>
            </div>
            <button type="button" class="btn btn-outline-primary btn-block">Поменять почту</button>
            <button type="button" class="btn btn-outline-primary btn-block">Поменять пароль</button>
          </div>
        </div>
          <ul class="list-group settings-controls">
            <li class="list-group-item d-flex align-items-center justify-content-between">
              <span>Уведомления о сообщениях</span>
              <div class="custom-control custom-switch" style="transform: scale(1.5); transform-origin: right center">
                <input type="checkbox" class="custom-control-input" id="setting1" checked>
                <label class="custom-control-label" for="setting1"><span class="sr-only">Уведомления о сообщениях</span></label>
              </div>
            </li>
            <li class="list-group-item d-flex align-items-center justify-content-between">
              <label class="mb-0" for="setting2">Размер шрифта</label>
              <input type="text" class="form-control w-auto text-center" id="setting2" value="16 px" size="6">
            </li>
            <li class="list-group-item d-flex align-items-center justify-content-between">
              <span>Показывать статус в сети</span>
              <div class="custom-control custom-switch" style="transform: scale(1.5); transform-origin: right center">
                <input type="checkbox" class="custom-control-input" id="setting3" checked>
                <label class="custom-control-label" for="setting3"><span class="sr-only">Показывать статус в сети</span></label>
              </div>
            </li>
            <li class="list-group-item d-flex align-items-center justify-content-between">
              <label class="mb-0" for="setting4">Часовой пояс</label>
              <input type="text" class="form-control w-auto text-center" id="setting4" value="UTC+3" size="6">
            </li>
          </ul>
        </div>
      </div>
    </main>

  </div>
</div>

<!-- Нижнее меню для узких экранов -->
<nav class="navbar navbar-light bg-light fixed-bottom d-md-none justify-content-around">
    <a class="nav-link" href="index.html">Главная</a>
    <a class="nav-link" href="feed.html">Сиянье</a>
    <a class="nav-link" href="friends.html">Друзья</a>
    <a class="nav-link active" href="settings.html">Настройки</a>
</nav>
</body>
</html>
