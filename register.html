<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
  <title>Регистрация</title>
</head>
<body>

<div class="container min-vh-100 d-flex flex-column justify-content-center">
  <h1 class="text-center mb-5">Регистрация</h1>
  <form class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4 mx-auto">
    <div class="form-group">
      <label for="login">Логин</label>
      <input type="text" class="form-control" id="login" placeholder="Например, alex_01">
    </div>
    <div class="form-group">
      <label for="email">Почта</label>
      <input type="email" class="form-control" id="email" placeholder="alex@example.com">
    </div>
    <div class="form-group">
      <label for="password">Пароль</label>
      <div class="input-group">
        <input type="password" class="form-control" id="password" placeholder="Не менее 8 символов">
        <div class="input-group-append">
          <button class="btn btn-outline-secondary" type="button">Показать пароль</button>
        </div>
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block btn-lg mt-5">Создать аккаунт</button>
    <p class="text-center mt-3">У вас уже есть аккаунт? <a href="login.html">Вход</a></p>
  </form>
</div>
</body>
</html>
